<!DOCTYPE html>
<html lang="ko" layout:decorate="~{layouts/noheader}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>회원가입 | 씀페이</title>
</head>
<body>
<section layout:fragment="contents">
    <div class="text-center mt-5">
        <h1 class="font-weight-bold" style="font-size: 3rem;">씀<span style="font-weight: normal;">Pay</span></h1>
        <h4 class="mt-2 mb-4">회원가입</h4>

        <div class="container" style="max-width: 430px;">
            <form id="joinForm">
                <div class="d-flex mt-3 justify-content-between">
                    <input type="text" class="form-control col-8 mr-1" placeholder="아이디" id="idInput">
                    <button type="button" class="btn btn-info btn-sm col-4" id="duplicateBtn">중복확인</button>
                </div>
                <div class="small text-success text-left d-none" id="availableText">사용 가능한 ID 입니다.</div>
                <div class="small text-danger text-left d-none" id="duplicateText">중복된 ID입니다.</div>

                <input type="password" class="form-control mt-3" placeholder="패스워드" id="passwordInput">
                <input type="password" class="form-control mt-3" placeholder="패스워드 확인" id="passwordConfirmInput">

                <input type="text" class="form-control mt-3" placeholder="이름" id="nameInput">
                <input type="text" class="form-control mt-3" placeholder="이메일" id="emailInput">

                <div class="form-group d-flex justify-content-between mt-3">
                    <select class="form-control mr-2" id="yearSelect">
                        <option value="">YYYY</option>
                    </select>
                    <select class="form-control mr-2" id="monthSelect">
                        <option value="">MM</option>
                    </select>
                    <select class="form-control" id="daySelect">
                        <option value="">DD</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-info btn-block mt-3">가입하기</button>
            </form>

            <p class="mt-3">계정이 있으신가요? <a href="/user/login-view">로그인</a></p>
        </div>
    </div>
</section>

<script layout:fragment="script">
$(function() {
    let isDuplicateCheck = false;
    let isDuplicateId = true;

    // 생년월일 추가
    for (let y = 1950; y <= new Date().getFullYear(); y++) {
        $('#yearSelect').append(`<option value="${y}">${y}</option>`);
    }
    for (let m = 1; m <= 12; m++) {
        $('#monthSelect').append(`<option value="${String(m).padStart(2, '0')}">${m}</option>`);
    }
    for (let d = 1; d <= 31; d++) {
        $('#daySelect').append(`<option value="${String(d).padStart(2, '0')}">${d}</option>`);
    }

    $("#idInput").on("input", function () {
        isDuplicateCheck = false;
        isDuplicateId = true;
        $("#availableText").addClass("d-none");
        $("#duplicateText").addClass("d-none");
    });

    $("#duplicateBtn").on("click", function () {
        let id = $("#idInput").val();
        if (!id) {
            alert("아이디를 입력하세요");
            return;
        }

        $.ajax({
            type: "get",
            url: "/user/duplicate-id",
            data: { loginId: id },
            success: function (response) {
                isDuplicateCheck = true;
                isDuplicateId = response.isDuplicate;

                if (isDuplicateId) {
                    $("#duplicateText").removeClass("d-none");
                    $("#availableText").addClass("d-none");
                } else {
                    $("#availableText").removeClass("d-none");
                    $("#duplicateText").addClass("d-none");
                }
            },
            error: function () {
                alert("중복확인 오류!");
            }
        });
    });

    $("#joinForm").on("submit", function (e) {
        e.preventDefault();

        let id = $("#idInput").val();
        let pw = $("#passwordInput").val();
        let pw2 = $("#passwordConfirmInput").val();
        let name = $("#nameInput").val();
        let email = $("#emailInput").val();

        let year = $("#yearSelect").val();
        let month = $("#monthSelect").val();
        let day = $("#daySelect").val();

        if (!isDuplicateCheck) {
            alert("아이디 중복 확인을 해주세요");
            return;
        }

        if (isDuplicateId) {
            alert("중복된 아이디입니다");
            return;
        }

        if (pw !== pw2) {
            alert("비밀번호가 일치하지 않습니다");
            return;
        }

        if (name === "") {
            alert("이름을 입력해주세요");
            return;
        }

        if (email === "") {
            alert("이메일을 입력해주세요");
            return;
        }

        if (!year || !month || !day) {
            alert("생년월일을 선택해주세요");
            return;
        }

        let birthDate = `${year}-${month}-${day}`;

        $.ajax({
            type: "post",
            url: "/user/join",
            data: {
                loginId: id,
                password: pw,
                name: name,
                email: email,
                birthDate: birthDate
            },
            success: function (response) {
                if (response.result === "success") {
                    alert("회원가입 완료!");
                    location.href = "/user/login-view";
                } else {
                    alert("회원가입 실패!");
                }
            },
            error: function () {
                alert("회원가입 오류!");
            }
        });
    });
});
</script>
</body>
</html>
